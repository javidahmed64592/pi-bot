[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-bot"
version = "0.1.0"
description = "An Ollama-based AI companion bot with electronics integration, hosted on a Pi 5."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Javid Ahmed", email = "javidahmed@icloud.com" }
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "gpiozero>=2.0.1",
    "lgpio>=0.2.2.0",
    "ollama>=0.6.2",
    "piper-tts>=1.4.2",
    "pyaudio>=0.2.14",
    "smbus2>=0.6.1",
    "template-python @ git+https://github.com/javidahmed64592/template-python.git",
    "vosk>=0.3.45",
]

[project.optional-dependencies]
dev = [
    "template-python[dev] @ git+https://github.com/javidahmed64592/template-python.git",
]
docs = [
    "template-python[docs] @ git+https://github.com/javidahmed64592/template-python.git",
]

[project.urls]
repository = "https://github.com/javidahmed64592/pi-bot"
documentation = "https://javidahmed64592.github.io/pi-bot"

[project.scripts]
pi-bot = "pi_bot.main:main"
pi-bot-debug = "pi_bot.main:debug"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
  "pi_bot/**",
]

[tool.pytest.ini_options]
addopts = [
    "-vv",
    "--cov",
    "--cov-report",
    "term-missing",
]

[tool.coverage.run]
branch = true
source = ["pi_bot", "tests"]

[tool.coverage.report]
fail_under = 0
skip_covered = false
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

extend-exclude = [
    "**/__init__.py",
]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ASYNC",
    "B",
    "C4",
    "D",
    "E",
    "EM",
    "F",
    "FBT",
    "G",
    "I",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PL",
    "PT",
    "RET",
    "RUF",
    "S",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "D203",
    "D213",
    "PLR0913",
    "S101"
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"
