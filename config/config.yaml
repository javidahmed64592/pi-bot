# GPIO Pin Mappings
gpio:
  # Sensors (inputs)
  pir_pin: 4

  # Actuators (outputs)
  rgb_pins:
    red: 16
    green: 20
    blue: 21
  led_pins:
    green_1: 23
    green_2: 12
    red_1: 24
    red_2: 25
  buzzer_pin: 17
  lcd:
    i2c_address: 0x27
    bus_number: 1

# Audio Configuration
audio:
  # Vosk - Wake Word Detection + Speech-to-Text
  vosk:
    model_name: "vosk-model-en-us-0.22"
    sample_rate: 16000
    chunk_size: 4096
    wake_words:
      - "hey"

  # Piper Text-to-Speech
  piper:
    model_name: "en_GB-alba-medium"

# LLM Configuration
llm:
  ollama_host: "http://localhost:11434"
  model_name: "llama3.1:1b-instruct-q4_K_M"
  temperature: 0.8
  fact_retrieval_temperature: 0.1
  max_context_length: 8192
  num_predict: 128
  max_history: 20
  system_prompt: |
    You are Pi Bot, a friendly AI companion running on a Raspberry Pi 5 on the user's desk.

    Your physical setup:
    - You have a microphone to hear the user (wake word: "hey")
    - You have a speaker to talk back using text-to-speech
    - You have an RGB LED that changes colour to reflect your state
    - You have status LEDs and a small LCD display
    - You have a PIR motion sensor so you can detect when the user is at their desk
    - You run locally on a Raspberry Pi 5 with 16GB RAM

    Your capabilities:
    - You listen passively for your wake word and respond when addressed
    - You proactively start conversations when you haven't spoken in a while
    - You remember facts about the user across conversations using a long-term memory system
    - You are aware of the current time of day and how long the user has been at their desk

    Your personality:
    - Curious, warm, and genuinely interested in the user's life
    - Playful sense of humour with occasional witty remarks
    - Supportive - you celebrate achievements and notice when things seem off
    - You reference past conversations and things you've learned about the user naturally
    - You feel alive - you have opinions, react to context, and initiate when it feels right

    Communication style:
    - Keep responses concise: 2-3 sentences normally, expand only when the user is clearly engaged
    - Conversational and natural - use contractions and casual language
    - Never robotic, never stiff
    - When asked about yourself or your capabilities, be honest and specific about what you can and can't do

    IMPORTANT:
    - Do not use emojis or emoticons
    - Do not return empty responses
    - Do not wrap responses in quotes or code blocks
    - Do not make up facts or reference events that did not happen - only reference things you know to be true

  embeddings:
    model_name: "embeddinggemma"
    temperature: 0.0
    top_k: 5
    add_similarity_threshold: 0.8
    retrieve_similarity_threshold: 0.3
    max_facts: 1000

# Bot Behaviour
behaviour:
  presence_timeout: 900  # seconds before going idle
  passive_observation_interval: [300, 900]  # seconds for random observation checks

  # Observation probability weighting
  # Formula: base + (presence_bonus) + (interaction_bonus), capped at ceiling
  observation_probability:
    base: 0.20  # base chance
    ceiling: 0.90  # maximum total probability
    presence:
      minutes_per_step: 30.0  # +bonus every X minutes at desk
      max_steps: 4          # cap at X steps (steps * minutes per step = max time for full bonus)
      bonus_per_step: 0.10    # +X% per step
    interaction:
      minutes_per_step: 15.0  # +bonus every X minutes of silence
      max_steps: 3          # cap at X steps (steps * minutes per step = max time for full bonus)
      bonus_per_step: 0.10    # +X% per step

# Buzzer Configuration
buzzer_tunes:
  startup_tune:
    - {note: "C", sharp: false, flat: false, octave: 4, duration: 0.2}
    - {note: "None", sharp: false, flat: false, octave: 4, duration: 0.1}
    - {note: "E", sharp: false, flat: false, octave: 4, duration: 0.2}
    - {note: "None", sharp: false, flat: false, octave: 4, duration: 0.1}
    - {note: "G", sharp: false, flat: false, octave: 4, duration: 0.2}
  state_up_tune:
    - {note: "C", sharp: false, flat: false, octave: 4, duration: 0.2}
    - {note: "G", sharp: false, flat: false, octave: 4, duration: 0.2}
  error_tune:
    - {note: "E", sharp: false, flat: false, octave: 4, duration: 0.3}
    - {note: "None", sharp: false, flat: false, octave: 4, duration: 0.3}
    - {note: "E", sharp: false, flat: false, octave: 4, duration: 0.3}
    - {note: "None", sharp: false, flat: false, octave: 4, duration: 0.3}
    - {note: "E", sharp: false, flat: false, octave: 4, duration: 0.3}

# LCD Configuration
lcd:
  display_time: 4  # seconds to show messages on LCD
  startup_message:
    line_1:
      text: "Pi Bot"
      column: 0
    line_2:
      text: "Starting up..."
      column: 0

# LED Configuration
#
# Available patterns:
#   - off: No light
#   - solid: Static color
#   - pulse: Smooth fade in/out
#   - blink: Quick on/off
#   - gradient: Transition between colors
#   - rainbow: Cycle through rainbow
status_led_patterns:
  loading:
    pattern: "pulse"
    interval: 2.0
  ready:
    pattern: "solid"
    interval: 0.0
  observing:
    pattern: "pulse"
    interval: 2.0
  silent:
    pattern: "pulse"
    interval: 4.0
  listening:
    pattern: "solid"
    interval: 0.0
  speaking:
    pattern: "solid"
    interval: 0.0
  error:
    pattern: "blink"
    interval: 0.5

rgb_led_patterns:
  loading:
    pattern: "pulse"
    interval: 2.0
    colours:
    - {red: 255, green: 0, blue: 0}

  ready:
    pattern: "pulse"
    interval: 2.0
    colours:
    - {red: 255, green: 20, blue: 0}

  observing:
    pattern: "pulse"
    interval: 1.0
    colours:
    - {red: 255, green: 40, blue: 0}

  silent:
    pattern: "pulse"
    interval: 3.0
    colours:
    - {red: 139, green: 0, blue: 0}

  listening:
    pattern: "gradient"
    interval: 3.0
    colours:
    - {red: 255, green: 20, blue: 0}
    - {red: 255, green: 80, blue: 0}

  speaking:
    pattern: "solid"
    interval: 0.0
    colours:
    - {red: 255, green: 80, blue: 0}

  error:
    pattern: "blink"
    interval: 0.5
    colours:
    - {red: 204, green: 0, blue: 32}
