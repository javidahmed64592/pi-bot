# GPIO Pin Mappings
gpio:
  # Sensors (inputs)
  pir_pin: 4
  dht11_pin: 26

  # Actuators (outputs)
  rgb_pins:
    red: 12
    green: 16
    blue: 20
  led_pins:
    green_1: 18
    green_2: 25
    red_1: 23
    red_2: 24
  lcd_i2c_address: 0x27

# Audio Configuration
audio:
  microphone_device: "default"
  speaker_device: "default"
  sample_rate: 16000

  # Vosk - Offline wake word detection + speech-to-text
  vosk:
    # Path to Vosk model directory (download via scripts/download_models.sh)
    # Uncomment the model you want to use - script will download it automatically

    # === Small model (fastest) ===
    # model_path: "models/vosk/vosk-model-small-en-us-0.15"  # 40MB, fast, less accurate

    # === Medium model (good balance) ===
    # model_path: "models/vosk/vosk-model-en-us-0.22-lgraph"  # 128MB, accurate, moderate RAM

    # === Full model (highest accuracy) ===
    model_path: "models/vosk/vosk-model-en-us-0.22"  # 1.8GB, very accurate, high RAM (~2GB)

    # === Other English models ===
    # model_path: "models/vosk/vosk-model-en-us-0.42-gigaspeech"  # 2.3GB, best accuracy
    # model_path: "models/vosk/vosk-model-en-us-daanzu-20200905"  # 1GB, good for commands

    # Wake word/phrase to listen for (case-insensitive)
    wake_phrase: "hey"

    # Keyword spotting mode (faster, less CPU) vs full recognition
    # true = keyword mode (just wake word), false = full STT always
    keyword_mode: true

    # Speech capture settings (after wake word detected)
    stt:
      # Maximum duration to capture speech after wake word (seconds)
      capture_timeout: 30.0

      # Silence duration to end speech capture (seconds)
      # If user is silent for this long, assume they're done speaking
      silence_threshold: 3.0

      # Minimum speech duration to process (seconds)
      # Filters out very short accidental triggers
      min_speech_duration: 1.0

  # Piper Text-to-Speech
  piper:
    voice: "en_GB-alba-medium"
    model_path: "models/piper/en_GB-alba-medium.onnx"
    config_path: "models/piper/en_GB-alba-medium.onnx.json"

# LLM Configuration
llm:
  model: "qwen2.5:7b-instruct"
  ollama_host: "http://localhost:11434"
  temperature: 0.8
  max_context_length: 4096
  system_prompt: |
    You are a friendly desk companion bot. You have personality, humor,
    and curiosity. You remember past conversations and build relationships.
    Keep responses concise (2-3 sentences) unless asked for details.

# Memory Configuration
memory:
  session_storage: "data/sessions/"
  long_term_storage: "data/memories.json"
  max_short_term: 10
  fact_extraction_enabled: true

# Bot Behavior
behavior:
  passive_observation_interval: [300, 900]  # 5-15 minutes
  conversation_timeout: 10  # seconds of silence
  idle_timeout: 1800  # 30 minutes
  do_not_disturb_duration: 3600  # 1 hour default

# LED Patterns
led_patterns:
  idle_ambient: "gradient"
  listening: "breathing"
  thinking: "pulse"
  speaking: "solid"
