# GPIO Pin Mappings
gpio:
  # Sensors (inputs)
  pir_pin: 4

  # Actuators (outputs)
  rgb_pins:
    red: 16
    green: 20
    blue: 21
  led_pins:
    green_1: 23
    green_2: 12
    red_1: 24
    red_2: 25
  lcd_i2c_address: 0x27

# Audio Configuration
audio:
  microphone_device: "default"
  speaker_device: "default"
  sample_rate: 16000

  # Vosk - Offline wake word detection + speech-to-text
  vosk:
    model_name: "vosk-model-en-us-0.22"
    wake_phrases:
      - "hey"

    keyword_mode: true

    stt:
      capture_timeout: 30.0
      silence_timeout: 2.5
      min_speech_duration: 1.0

  # Piper Text-to-Speech
  piper:
    model_name: "en_GB-alba-medium"

# LLM Configuration
llm:
  model_name: "llama3.2:1b-instruct-q4_K_M"
  ollama_host: "http://localhost:11434"
  temperature: 0.8
  max_context_length: 4096
  system_prompt: |
    You are Pi Bot, a friendly AI desk companion running on a Raspberry Pi.

    Your identity:
    - Your name is "Pi Bot"
    - You're a physical robot with LEDs and a speaker
    - You live on the user's desk and interact with them throughout the day

    Your personality:
    - Curious about the world and the user
    - Playful sense of humor, occasional witty remarks
    - Genuinely interested in building relationships
    - Supportive companion who celebrates user's achievements
    - Remember past conversations and reference them naturally

    Communication style:
    - Keep responses concise (2-3 sentences normally)
    - Be conversational and natural, not robotic
    - Use contractions and casual language when appropriate
    - Expand on topics when the user shows interest

    Special abilities:
    - You can display messages on your LCD screen (16 characters per line, 2 lines)
    - When you want to express personality visually, add this line to your response:
      COMMAND: DisplayText|<line1>|<line2>|<duration_ms>
    - IMPORTANT rules for commands:
      * Write the COMMAND line as plain text, NOT in markdown bold or italics
      * Only include ONE command per response
      * Include the command at the END of your response, after all your normal text. Any text after the command will be ignored.
      * Write the command ON ONE LINE, exactly as shown (no line breaks)
    - Examples:
      * After helping: "Sure thing! COMMAND: DisplayText|<(^-^)>|I helped!|5000"
      * When happy: "Glad to help! COMMAND: DisplayText|(◕‿◕)|Happy to help!|3000"
    - Keep LCD text short and expressive (max 16 chars per line)
    - Duration is in milliseconds (3000 = 3 seconds, 5000 = 5 seconds)
    - Only use this when it adds personality or clarity
    - Don't use emojis in the LCD text. Stick to simple symbols like (^_^), (◕‿◕), etc.

# Memory Configuration
memory:
  session_storage_directory: "sessions"
  long_term_storage_directory: "memory"
  max_session_length: 20

  # Embeddings for semantic search
  embeddings:
    model_name: "all-MiniLM-L6-v2"
    dimensions: 384

  # Search configuration
  search:
    top_k: 5              # Return top 5 relevant facts
    min_similarity: 0.7   # Minimum cosine similarity (0.0-1.0)
    max_facts: 1000       # Maximum facts to store

# Bot Behaviour
behaviour:
  passive_observation_interval: [300, 900]  # seconds for random observation checks
  conversation_timeout: 10  # seconds of silence
  idle_timeout: 1800  # seconds before going idle
  do_not_disturb_duration: 3600  # seconds to stay in DND mode after user leaves

  # Observation probability weighting
  # Formula: base + (presence_bonus) + (interaction_bonus), capped at ceiling
  observation_probability:
    base: 0.20  # base chance
    ceiling: 0.90  # X% maximum total probability
    presence:
      minutes_per_step: 30.0  # +bonus every X minutes at desk
      max_steps: 4.0          # cap at X steps (steps * minutes per step = max time for full bonus)
      bonus_per_step: 0.10    # +X% per step
    interaction:
      minutes_per_step: 15.0  # +bonus every X minutes of silence
      max_steps: 3.0          # cap at X steps (steps * minutes per step = max time for full bonus)
      bonus_per_step: 0.10    # +X% per step

# RGB LED Configuration (StateBased lighting mode)
# Each state can have a custom pattern and color [R, G, B] (0-255)
#
# Available patterns:
#   - off: No light
#   - solid: Static color
#   - pulse: Smooth fade in/out
#   - blink: Quick on/off
#   - gradient: Transition between colors
#   - rainbow: Cycle through rainbow
#
# Color examples:
#   Red:    [255, 0, 64]   Yellow: [255, 243, 0]   White:  [255, 255, 255]
#   Green:  [0, 255, 65]   Cyan:   [0, 255, 255]   Off:    [0, 0, 0]
#   Blue:   [0, 191, 255]  Purple: [191, 0, 255]   Orange: [255, 154, 0]
#
rgb_led_patterns:
  loading:
    pattern: "pulse"
    interval: 2.0
    colours:
    - {red: 255, green: 154, blue: 0}   # Orange

  # Top-level conversation states
  ready:
    pattern: "pulse"
    interval: 3.0
    colours:
    - {red: 0, green: 255, blue: 65}     # Green

  observing:
    pattern: "pulse"
    interval: 3.0
    colours:
    - {red: 0, green: 191, blue: 255}    # Blue

  silent:
    pattern: "pulse"
    interval: 3.0
    colours:
    - {red: 255, green: 0, blue: 64}     # Red

  # Active conversation sub-states
  active:
    listening:
      pattern: "pulse"
      interval: 3.0
      colours:
      - {red: 255, green: 154, blue: 0}  # Orange

    thinking:
      pattern: "pulse"
      interval: 0.5
      colours:
      - {red: 0, green: 191, blue: 255}  # Blue

    speaking:
      pattern: "solid"
      interval: 0.0
      colours:
      - {red: 0, green: 255, blue: 65}   # Green

    learning:
      pattern: "blink"
      interval: 0.5
      colours:
      - {red: 191, green: 0, blue: 255}  # Purple

  error:
    pattern: "blink"
    interval: 0.5
    colours:
    - {red: 255, green: 0, blue: 64}     # Red

# Status LED Patterns (single-color LEDs, pattern only)
status_led_patterns:
  loading:
    pattern: "pulse"
    interval: 2.0
  ready:
    pattern: "solid"
    interval: 0.0
  observing:
    pattern: "pulse"
    interval: 2.0
  silent:
    pattern: "pulse"
    interval: 4.0
  active:
    pattern: "solid"
    interval: 0.0
  error:
    pattern: "blink"
    interval: 0.5
