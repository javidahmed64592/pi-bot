[package]
name = "actuators"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Internal dependencies
bot_core = { path = "../bot_core" }
audio_pipeline = { path = "../audio_pipeline", optional = true }  # Only for TTS test binary

# GPIO for RGB LED (PWM), status LEDs, LCD (I2C)
rppal = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Logging
log = { workspace = true }
env_logger = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Audio playback for TTS
rodio = "0.19"

[features]
# Feature for TTS test binary that requires Vosk library
tts-test = ["audio_pipeline"]

[[bin]]
name = "tts-test"
required-features = ["tts-test"]
