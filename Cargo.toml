[workspace]
resolver = "2"
members = [
    "actuators",
    "ai_controller",
    "audio_pipeline",
    "bot_core",
    "runner",
    "sensors",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.40", features = ["full"] }

# Raspberry Pi GPIO
rppal = "0.22"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP client for Ollama API
reqwest = { version = "0.12", features = ["json"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time utilities
chrono = "0.4"
