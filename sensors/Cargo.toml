[package]
name = "sensors"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Internal dependencies
bot_core = { path = "../bot_core" }
audio_pipeline = { path = "../audio_pipeline", optional = true }

# GPIO for PIR sensor
rppal = { workspace = true }

# Async runtime
tokio = { workspace = true }

# JSON parsing for Python subprocess output
serde_json = { workspace = true }

# Logging
log = { workspace = true }
env_logger = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

[features]
# Feature for audio functionality (requires Vosk library)
audio = ["audio_pipeline"]

[[bin]]
name = "wake_word_test"
path = "src/bin/wake_word_test.rs"
required-features = ["audio"]

[[bin]]
name = "stt_test"
path = "src/bin/stt_test.rs"
required-features = ["audio"]
